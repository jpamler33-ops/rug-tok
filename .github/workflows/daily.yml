name: Daily Rug-Check video

on:
  schedule:
    - cron: "47 5 * * *"   # 05:47 UTC = 07:47 Berlin (Sommerzeit), 06:47 im Winter
  workflow_dispatch: {}

permissions:
  contents: write          # to commit content/state.json (episode counter) + evidence

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          bash scripts/setup_piper.sh   # offline fallback voice if edge-tts fails

      - name: Tests
        run: |
          python3 tests/test_data.py
          python3 tests/test_fetch.py

      - name: Find today's case
        id: fetch
        env:
          SOLANATRACKER_API_KEY: ${{ secrets.SOLANATRACKER_API_KEY }}
          RUGTOK_TELEGRAM_CTA: ${{ vars.RUGTOK_TELEGRAM_CTA || '0' }}
        run: |
          set +e
          python3 fetch_case.py
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" != "0" ]; then exit "$rc"; fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Build video
        if: steps.fetch.outputs.found == 'true'
        run: |
          python3 build.py "${{ steps.fetch.outputs.case }}" --out out/today.mp4

      - name: Send to Telegram
        if: steps.fetch.outputs.found == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: python3 deliver.py out/today.mp4 out/today_beschreibung.txt

      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.found == 'true'
        with:
          name: rug-check-video
          path: |
            out/today.mp4
            out/today_beschreibung.txt
          retention-days: 14

      - name: Save run report, episode counter + evidence
        if: always()
        run: |
          git config user.name "rug-tok bot"
          git config user.email "rug-tok-bot@users.noreply.github.com"
          git add content/ data/ 2>/dev/null || true
          git commit -m "Run $(date -u +%F_%H%M): found=${{ steps.fetch.outputs.found }}" || exit 0
          git pull --rebase -q origin main && git push
